<main class="bg-gray-50">
  <!-- Hero -->
  <section class="mx-auto max-w-3xl px-6 pt-20 pb-16 text-center sm:pt-28">
    <h1 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">Welcome to Url2Short</h1>
    <p class="mx-auto mt-4 max-w-xl text-base text-gray-500 sm:text-lg">
      Where you can shorten your links
    </p>
  </section>

  <!-- Try it -->
  <section id="try" class="mx-auto max-w-3xl px-6 pb-20">
    <h2 class="text-center text-2xl font-semibold tracking-tight text-gray-900">Try it</h2>
    <div class="mt-6">
      <app-short-url-form-component></app-short-url-form-component>
    </div>
  </section>

  <!-- How does it work? -->
  <section id="how" class="mx-auto max-w-5xl px-6 pb-24">
    <div class="rounded-md border border-gray-200 bg-white p-8 sm:p-10">
      <div class="grid items-center gap-10 md:grid-cols-2">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight text-gray-900">How does it work?</h2>
          <p class="mt-3 text-sm text-gray-500">Description goes here</p>
          <button
            type="button"
            class="mt-6 cursor-pointer rounded-md bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
          >
            Try it now
          </button>
        </div>

        <figure class="aspect-video overflow-hidden rounded-md border border-gray-200 bg-gray-50">
          <img
            src=""
            alt="Animated image showing how it works"
            class="h-full w-full object-cover"
          />
        </figure>
      </div>
    </div>
  </section>
</main>
